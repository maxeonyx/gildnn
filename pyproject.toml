[project]
name = "gildnn"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
    "numpy>=2.4.6",
    "pyarrow>=22.0.0",
    "torch==2.11.0+cu128",
    "torchvision>=0.26.0",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
